name: Release

on:
  workflow_dispatch:
    inputs:
      zeen_version:
        description: Zeen release to build with
        required: true
        default: "0.4.0"
      tag:
        description: Release tag
        required: true
        default: "v0.1.0"

run-name: ZeenSnake ${{ inputs.tag }}

permissions:
  contents: write

concurrency:
  group: zeensnake-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RAYLIB_VERSION: "6.0"

jobs:
  meta:
    name: Metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - id: meta
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          if [ -z "$TAG" ] || [ -z "$VERSION" ]; then
            echo "release tag must include a version" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux
    needs: meta
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Zeen
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/install-zeen.sh "${{ inputs.zeen_version }}" "$HOME/zeen"

      - name: Install raylib
        run: |
          RAYLIB_DIR="$RUNNER_TEMP/raylib"
          mkdir -p "$RAYLIB_DIR"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/raylib.tar.gz" \
            "https://github.com/raysan5/raylib/releases/download/$RAYLIB_VERSION/raylib-${RAYLIB_VERSION}_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/raylib.tar.gz" -C "$RAYLIB_DIR" --strip-components=1
          echo "RAYLIB_DIR=$RAYLIB_DIR" >> "$GITHUB_ENV"

      - name: Build and package
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: ci/build-linux.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/release/ZeenSnake-linux-x86_64.AppImage
            dist/release/ZeenSnake-linux-x86_64
            dist/release/ZeenSnake-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows
    needs: meta
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Zeen
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $version = "${{ inputs.zeen_version }}"
          $tag = if ($version.StartsWith("v")) { $version } else { "v$version" }
          $prefix = Join-Path $env:RUNNER_TEMP "zeen"
          $installer = Join-Path $env:RUNNER_TEMP "install-zeen.ps1"
          Invoke-WebRequest "https://raw.githubusercontent.com/mealet/zeen/$tag/install.ps1" -OutFile $installer
          & $installer -Version $tag -Prefix $prefix
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $prefix "bin")
          Add-Content -Path $env:GITHUB_ENV -Value "ZEEN_STD=$(Join-Path $prefix "share\zeen\std")"

      - name: Build raylib
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "raylib-src"
          $archive = Join-Path $env:RUNNER_TEMP "raylib.zip"
          $build = Join-Path $env:RUNNER_TEMP "raylib-build"
          Invoke-WebRequest "https://github.com/raysan5/raylib/archive/refs/tags/$env:RAYLIB_VERSION.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $source -Force
          $src = Join-Path $source "raylib-$env:RAYLIB_VERSION"
          $raylib = Join-Path $env:RUNNER_TEMP "raylib"
          Add-Content -Path $env:GITHUB_ENV -Value "RAYLIB_DIR=$raylib"
          cmake -S $src -B $build -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build $build --config Release --target raylib
          if ($LASTEXITCODE -ne 0) { throw "raylib build failed" }
          $lib = Get-ChildItem $build -Recurse -Filter raylib.lib |
            Where-Object { $_.FullName -match '\\Release\\' } |
            Select-Object -First 1
          if (-not $lib) { throw "raylib.lib not found" }
          if ($env:VCINSTALLDIR -and (Test-Path "$env:VCINSTALLDIR\Tools\MSVC")) {
            $dumpbin = Get-ChildItem "$env:VCINSTALLDIR\Tools\MSVC" -Recurse -Filter dumpbin.exe |
              Where-Object { $_.FullName -match 'Hostx64\\x64' } |
              Select-Object -First 1
            if ($dumpbin) {
              $imports = & $dumpbin.FullName /symbols $lib.FullName | Select-String "__imp_malloc"
              if ($imports) { throw "raylib.lib still imports the dynamic CRT" }
            }
          }
          New-Item -ItemType Directory -Path (Join-Path $raylib "lib") -Force | Out-Null
          Copy-Item $lib.FullName (Join-Path $raylib "lib\raylib.lib")

      - name: Build and package
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./ci/build-windows.ps1 -RaylibDir $env:RAYLIB_DIR

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/release/ZeenSnake.exe
            dist/release/ZeenSnake-windows-x86_64.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zeen
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/install-zeen.sh "${{ inputs.zeen_version }}" "$HOME/zeen"

      - name: Install raylib
        run: |
          RAYLIB_DIR="$RUNNER_TEMP/raylib"
          mkdir -p "$RAYLIB_DIR"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/raylib.tar.gz" \
            "https://github.com/raysan5/raylib/releases/download/$RAYLIB_VERSION/raylib-${RAYLIB_VERSION}_macos.tar.gz"
          tar -xzf "$RUNNER_TEMP/raylib.tar.gz" -C "$RAYLIB_DIR" --strip-components=1
          echo "RAYLIB_DIR=$RAYLIB_DIR" >> "$GITHUB_ENV"

      - name: Build and package
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: ci/build-macos.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/release/ZeenSnake-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  android:
    name: Android
    needs: meta
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_VERSION: "29.0.14206865"
      ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS=$SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"

      - name: Install Zeen
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/install-zeen.sh "${{ inputs.zeen_version }}" "$HOME/zeen"

      - name: Build raylib
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/raylib.tar.gz" \
            "https://github.com/raysan5/raylib/archive/refs/tags/$RAYLIB_VERSION.tar.gz"
          tar -xzf "$RUNNER_TEMP/raylib.tar.gz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/raylib-$RAYLIB_VERSION/src" -j"$(nproc)" \
            PLATFORM=PLATFORM_ANDROID \
            ANDROID_ARCH=arm64 \
            ANDROID_API_VERSION=29 \
            ANDROID_NDK="$ANDROID_NDK_HOME" \
            RAYLIB_LIBTYPE=STATIC \
            RAYLIB_BUILD_MODE=RELEASE

      - name: Build APK
        env:
          APK_NAME: ZeenSnake
          APP_VERSION_CODE: "1"
          APP_VERSION_NAME: ${{ needs.meta.outputs.version }}
        run: |
          RAYLIB_ANDROID="$RUNNER_TEMP/raylib-$RAYLIB_VERSION/src/libraylib.a" ./android/build.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/ZeenSnake.apk
          if-no-files-found: error

  release:
    name: Draft release
    needs:
      - meta
      - linux
      - windows
      - macos
      - android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ZeenSnake
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
