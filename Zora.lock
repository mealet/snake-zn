version = 3

[[package]]
name = "snake"
version = "0.0.0"
zeen = "^0.4.0"
dependencies = ["zaylib@cf759802ad7c70f00beb3b327adbdf1e11a1254e"]

[[package]]
name = "zaylib"
version = "0.0.0"
zeen = "^0.4.0"
dependencies = []
repository = "https://github.com/mealet/zaylib"
branch = "main"
commit = "cf759802ad7c70f00beb3b327adbdf1e11a1254e"

[package.build]
output = "zaylib"
link = ["raylib"]

[package.build.os.android]
link = [
    "raylib",
    "log",
    "android",
    "EGL",
    "GLESv2",
    "OpenSLES",
    "dl",
    "m",
]

[package.build.os.darwin]
link = ["raylib"]

[package.build.os.linux]
link = [
    "raylib",
    "m",
    "pthread",
    "dl",
    "rt",
    "GL",
    "X11",
]

[package.build.os.windows]
link = [
    "raylib",
    "winmm",
    "gdi32",
    "opengl32",
    "shell32",
    "ole32",
]

[package.build.family.unix]
link = [
    "raylib",
    "m",
    "pthread",
    "dl",
]
